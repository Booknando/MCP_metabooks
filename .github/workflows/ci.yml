name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar o pacote e as dependências de teste
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Conferir o entry point
        run: metabooks-mcp --help

      # O --help sai pelo argparse ANTES de construir o servidor, então sozinho
      # ele não prova nada sobre a inicialização. Esta é a checagem que prova.
      - name: O servidor tem de CONSTRUIR
        run: python -c "from metabooks_mcp.server import build_server; build_server()"

      - name: Rodar a suíte
        run: python -m pytest -q

  resolucao-de-dependencias:
    name: Instalação limpa, SDK ${{ matrix.sdk }} (protege o teto do mcp)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # As duas pontas do teto declarado em pyproject.toml. A assinatura do
        # `FastMCP.__init__` já mudou entre versões 1.x e derrubou o servidor na
        # instalação de quem usava; testar só uma ponta esconde exatamente isso.
        sdk: ["resolvida", "1.26.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O SDK mcp 2.x removeu `mcp.server.fastmcp`. Sem o teto em pyproject.toml
      # uma instalação limpa passa a resolver para 2.x e o servidor não importa.
      # Este job reproduz exatamente o caminho do README (pip install da pasta).
      - name: Instalar como o usuário final instala
        run: python -m pip install .

      - name: Fixar o piso do teto do SDK
        if: matrix.sdk != 'resolvida'
        run: python -m pip install "mcp[cli]==${{ matrix.sdk }}"

      - name: O entry point tem de funcionar
        run: metabooks-mcp --help

      # A prova que faltava: `--help` sai pelo argparse antes da construção do
      # FastMCP, então um argumento inválido no construtor passava batido aqui e
      # só quebrava na máquina de quem instalava.
      - name: O servidor tem de CONSTRUIR e registrar as 12 tools
        run: |
          python - <<'PY'
          import anyio
          from metabooks_mcp import __version__
          from metabooks_mcp.server import build_server
          mcp = build_server()
          tools = anyio.run(mcp.list_tools)
          assert len(tools) == 12, f"esperava 12 tools, achei {len(tools)}"
          assert mcp._mcp_server.version == __version__
          print(f"OK: metabooks-mcp {__version__} com {len(tools)} tools")
          PY

      - name: Registrar a versão do SDK resolvida
        run: python -c "from importlib.metadata import version; print('mcp', version('mcp'))"
