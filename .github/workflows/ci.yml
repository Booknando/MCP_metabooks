name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar o pacote e as dependências de teste
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Conferir se o servidor sobe
        run: metabooks-mcp --help

      - name: Rodar a suíte
        run: python -m pytest -q

  resolucao-de-dependencias:
    name: Instalação limpa (protege o teto do SDK mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O SDK mcp 2.x removeu `mcp.server.fastmcp`. Sem o teto em pyproject.toml
      # uma instalação limpa passa a resolver para 2.x e o servidor não importa.
      # Este job reproduz exatamente o caminho do README (pip install da pasta).
      - name: Instalar como o usuário final instala
        run: python -m pip install .

      - name: O entry point tem de funcionar
        run: metabooks-mcp --help

      - name: Registrar a versão do SDK resolvida
        run: python -c "from importlib.metadata import version; print('mcp', version('mcp'))"
