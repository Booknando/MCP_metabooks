name: Preparar release no GitHub

# Distribuição exclusivamente no GitHub. Nenhum upload para o PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir tag e versão
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as file:
              version = tomllib.load(file)['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          PY
      - name: Testar e construir
        run: |
          python -m pip install '.[dev]'
          python -m pytest -q
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/smoke_package.py
      - name: Preparar rascunho com os artefatos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "Metabooks MCP $GITHUB_REF_NAME" --notes-file CHANGELOG.md
