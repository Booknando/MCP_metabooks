[project]
name = "metabooks-mcp"
version = "2.7.0"
description = "MCP Server para a API REST v2 da Metabooks: metadados bibliográficos, capas, mídias e editoras."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Booknando Livros" }]
requires-python = ">=3.12"
keywords = ["metabooks", "isbn", "bibliografico", "mcp", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    # Teto obrigatório: o SDK 2.x removeu `mcp.server.fastmcp` (virou
    # `mcp.server.mcpserver.MCPServer`) e o servidor não importa sem o teto.
    "mcp[cli]>=1.26.0,<2",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/Booknando/MCP_metabooks"
Repository = "https://github.com/Booknando/MCP_metabooks"
Issues = "https://github.com/Booknando/MCP_metabooks/issues"

[project.scripts]
metabooks-mcp = "metabooks_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metabooks_mcp"]

[project.optional-dependencies]
dev = [
    "hatchling>=1.29.0",
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
